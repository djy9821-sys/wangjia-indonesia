<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="WANGJIA">
  <!-- Placeholder wordmark until 李总 provides the official WANGJIA logo file. -->
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5A8A"/>
      <stop offset="1" stop-color="#1B8A5A"/>
    </linearGradient>
  </defs>
  <!-- paddle wheel aerator mark -->
  <g transform="translate(60 60)">
    <circle r="52" fill="url(#w)"/>
    <circle r="40" fill="none" stroke="#fff" stroke-width="5"/>
    <g fill="#fff">
      <rect x="-5" y="-40" width="10" height="34" rx="2"/>
      <rect x="-5" y="-40" width="10" height="34" rx="2" transform="rotate(60)"/>
      <rect x="-5" y="-40" width="10" height="34" rx="2" transform="rotate(120)"/>
      <rect x="-5" y="-40" width="10" height="34" rx="2" transform="rotate(180)"/>
      <rect x="-5" y="-40" width="10" height="34" rx="2" transform="rotate(240)"/>
      <rect x="-5" y="-40" width="10" height="34" rx="2" transform="rotate(300)"/>
      <circle r="9"/>
    </g>
    <!-- water line -->
    <path d="M-52 22 Q-39 12 -26 22 T0 22 T26 22 T52 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
  <text x="130" y="76" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="#0E5A8A">WANGJIA</text>
  <text x="133" y="102" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#1B8A5A">KINCIR AIR · AERATOR TAMBAK</text>
</svg>
