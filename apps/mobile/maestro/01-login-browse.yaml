# Maestro end-to-end flow (https://maestro.mobile.dev). Run against a device or
# simulator with the app installed:
#   maestro test maestro/ -e EMAIL=budi@contoh.id -e PASSWORD=rahasia123
# Texts are the Indonesian UI strings (lib/l10n/strings.dart).
# appId is the iOS bundle id; on Android change it to id.co.wangjia.wangjia_app.
appId: id.co.wangjia.wangjiaApp
---
- launchApp:
    clearState: true
# The app opens on the catalogue as a guest; the sign-in page is reached from the account tab.
- tapOn: "Akun"
- tapOn: "Masuk / Daftar"
- assertVisible: "Masuk"
- tapOn:
    id: "email"
    optional: true
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Kata sandi"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Masuk"
    index: 1
- assertVisible: "Produk"
- tapOn: "Produk"
- tapOn: "Suku Cadang"
- assertVisible:
    text: ".*WANGJIA.*"
- tapOn: "Semua"
- tapOn:
    text: "Kincir Air WANGJIA 2 HP"
- assertVisible: "Pesan Sekarang"
- back
