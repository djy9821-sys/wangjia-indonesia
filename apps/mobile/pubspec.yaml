name: wangjia_app
description: Aplikasi resmi WANGJIA — kincir air / aerator tambak (PT Adhinusa Lestari Jaya).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#0E5A8A"
  adaptive_icon_foreground: "assets/brand/icon.png"
