name: wangjia_app
description: Aplikasi resmi WANGJIA — kincir air / aerator tambak (PT Adhinusa Lestari Jaya).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  webview_flutter: ^4.14.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  mobile_scanner: ^7.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  sentry: ^10.3.0
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The tests' stand-in for the phone's camera and gallery.
  image_picker_platform_interface: ^2.11.2
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon-adaptive.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash.png
  ios: true
  android: true
  web: false
