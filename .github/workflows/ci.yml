name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/backend
      - name: Lint
        run: npx medusa lint
        working-directory: apps/backend
      - name: Integration tests
        run: pnpm test:integration:http
        working-directory: apps/backend
        env:
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          RATE_LIMIT_DISABLED: "true"
          OTP_DEV_CODE: "000000"
          ADMIN_DEFAULT_ROLE: owner

  storefront:
    name: Storefront (types, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/storefront
      - name: Lint
        run: pnpm lint
        working-directory: apps/storefront

  mobile:
    name: Mobile app (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  # Installable Android build for testers (no Mac needed): download the APK from
  # the run's Artifacts. Signed with the debug key until android/key.properties exists.
  android-apk:
    name: Android APK (test build)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=MEDUSA_URL=${{ vars.MEDUSA_URL || 'https://api.wangjia.co.id' }}
          --dart-define=MEDUSA_PUBLISHABLE_KEY=${{ vars.MEDUSA_PUBLISHABLE_KEY || 'pk_test' }}
          --dart-define=STOREFRONT_URL=${{ vars.STOREFRONT_URL || 'https://wangjia.co.id' }}
          --dart-define=WHATSAPP_NUMBER=${{ vars.WHATSAPP_NUMBER || '6281200000000' }}
          --dart-define=PRIVACY_URL=${{ vars.STOREFRONT_URL || 'https://wangjia.co.id' }}/id/privacy
          --dart-define=APP_ENV=staging
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: wangjia-app-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
