name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run (Actions > CI > Run workflow): an installable Android APK that talks
  # to the backend you name, e.g. a developer machine in the same Wi-Fi.
  workflow_dispatch:
    inputs:
      medusa_url:
        description: Backend URL the app talks to (http://192.168.x.x:9000 or https://...)
        required: true
      publishable_key:
        description: Publishable API key of that backend
        required: true
      storefront_url:
        description: Web store URL (share links, privacy page)
        required: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, integration tests)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/backend
      - name: Lint
        run: npx medusa lint
        working-directory: apps/backend
      - name: Unit tests
        run: pnpm test:unit
        working-directory: apps/backend
      - name: Integration tests
        run: pnpm test:integration:http
        working-directory: apps/backend
        env:
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          RATE_LIMIT_DISABLED: "true"
          OTP_DEV_CODE: "000000"
          ADMIN_DEFAULT_ROLE: owner

  storefront:
    name: Storefront (types, lint)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/storefront
      - name: Lint
        run: pnpm lint
        working-directory: apps/storefront

  mobile:
    name: Mobile app (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  # Installable Android build for testers (no Mac needed): download the APK from
  # the run's Artifacts. Signed with the debug key until android/key.properties exists.
  # On push it targets the Actions variables below; a manual run targets its inputs.
  android-apk:
    name: Android APK (test build)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [mobile]
    steps:
      - uses: actions/checkout@v4
      # The key ships inside the app, so it is not a secret, but keep it out of the log.
      - name: Mask the publishable key
        if: github.event_name == 'workflow_dispatch'
        run: echo "::add-mask::$(jq -r '.inputs.publishable_key' "$GITHUB_EVENT_PATH")"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Build APK
        env:
          MEDUSA_URL: ${{ inputs.medusa_url || vars.MEDUSA_URL || 'https://api.wangjia.co.id' }}
          MEDUSA_PUBLISHABLE_KEY: ${{ inputs.publishable_key || vars.MEDUSA_PUBLISHABLE_KEY || 'pk_test' }}
          STOREFRONT_URL: ${{ inputs.storefront_url || vars.STOREFRONT_URL || 'https://wangjia.co.id' }}
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER || '6281200000000' }}
        run: |
          extra=()
          # A plain-HTTP backend (developer machine on the LAN) needs cleartext allowed.
          case "$MEDUSA_URL" in http://*) extra+=(--android-project-arg=allowCleartext=true) ;; esac
          # Phones only (arm, arm64); the x86 slice is for emulators and doubles the wait.
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --dart-define=MEDUSA_URL="$MEDUSA_URL" \
            --dart-define=MEDUSA_PUBLISHABLE_KEY="$MEDUSA_PUBLISHABLE_KEY" \
            --dart-define=STOREFRONT_URL="$STOREFRONT_URL" \
            --dart-define=WHATSAPP_NUMBER="$WHATSAPP_NUMBER" \
            --dart-define=PRIVACY_URL="$STOREFRONT_URL/id/privacy" \
            --dart-define=APP_ENV=staging \
            "${extra[@]}"
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: wangjia-app-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
